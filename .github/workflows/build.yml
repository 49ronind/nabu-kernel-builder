name: Build Xiaomi Pad 5 (nabu) HyperOS Kernel with KernelSU-Next v3

on:
  workflow_dispatch:
    inputs:
      ksu_tag:
        description: 'KernelSU-Next legacy tag or branch (default: legacy)'
        required: true
        default: 'legacy'
        type: string
      create_release:
        description: 'Publish as a GitHub Release?'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Compile Nabu HyperOS Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            build-essential bc flex bison libssl-dev libelf-dev \
            libncurses-dev zip curl git lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Clone Mahiro Nabu Kernel Source
        run: |
          git clone --depth=1 https://github.com/utziacre/android_kernel_xiaomi_nabu.git kernel_source

      - name: Download Official AOSP Clang Toolchain (r416183b)
        run: |
          mkdir -p clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz

      - name: Integrate KernelSU-Next (${{ inputs.ksu_tag }}) & Supercall Hooks
        working-directory: kernel_source
        run: |
          echo "[+] Integrating KernelSU-Next (${{ inputs.ksu_tag }})..."
          
          # Clone KernelSU-Next legacy driver
          git clone --depth=1 -b ${{ inputs.ksu_tag }} https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          
          # Link into kernel drivers tree
          ln -sf "$(pwd)/KernelSU-Next/kernel" drivers/kernelsu
          
          # Link into Makefile and Kconfig if not present
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # Patch KernelSU-Next v3 Supercall hook into kernel/reboot.c if not present
          if ! grep -q "ksu_handle_sys_reboot" kernel/reboot.c; then
            echo "[+] Injecting ksu_handle_sys_reboot hook into kernel/reboot.c..."
            sed -i '/SYSCALL_DEFINE4(reboot/a #ifdef CONFIG_KSU_MANUAL_HOOK\n\textern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif' kernel/reboot.c
          fi

          # Configure defconfigs for Manual Hook mode
          for conf in arch/arm64/configs/nabu_defconfig arch/arm64/configs/nabu-perf_defconfig; do
            if [ -f "$conf" ]; then
              echo "[+] Updating $conf..."
              sed -i '/CONFIG_KSU/d' "$conf" || true
              sed -i '/CONFIG_OVERLAY_FS/d' "$conf" || true
              echo "CONFIG_KSU=y" >> "$conf"
              echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$conf"
              echo "CONFIG_OVERLAY_FS=y" >> "$conf"
            fi
          done

      - name: Pre-Flight Integrity Check
        working-directory: kernel_source
        run: |
          echo "[+] Running Pre-Flight Verification Checks..."
          
          # Verify Toolchain binaries
          export PATH="$(pwd)/../clang/bin:$PATH"
          clang --version | head -n 1
          ld.lld --version | head -n 1
          aarch64-linux-gnu-gcc --version | head -n 1
          arm-linux-gnueabi-gcc --version | head -n 1
          
          # Verify KernelSU manual hooks
          grep -q "ksu_handle_execveat" fs/exec.c || { echo "[-] Missing ksu_handle_execveat"; exit 1; }
          grep -q "ksu_handle_sys_reboot" kernel/reboot.c || { echo "[-] Missing ksu_handle_sys_reboot"; exit 1; }
          grep -q "CONFIG_KSU_MANUAL_HOOK=y" arch/arm64/configs/nabu_defconfig || { echo "[-] Missing CONFIG_KSU_MANUAL_HOOK"; exit 1; }
          
          echo "[+] Pre-Flight Checks Passed 100%!"

      - name: Compile Kernel Image
        working-directory: kernel_source
        run: |
          export PATH="$(pwd)/../clang/bin:$PATH"

          # Step 1: Generate defconfig with full LLVM parameter set
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            nabu_defconfig

          # Step 2: Compile Kernel with ThinLTO-compatible toolchain
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb || \
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz dtbs

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          cd anykernel

          # Configure AnyKernel3 for Xiaomi Pad 5 (nabu)
          sed -i 's/device.name1=.*/device.name1=nabu/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=Xiaomi Pad 5/' anykernel.sh
          sed -i 's/block=.*/block=\/dev\/block\/bootdevice\/by-name\/boot;/' anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=auto/' anykernel.sh

          # Copy compiled outputs
          if [ -f ../kernel_source/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp ../kernel_source/out/arch/arm64/boot/Image.gz-dtb Image.gz-dtb
          elif [ -f ../kernel_source/out/arch/arm64/boot/Image.gz ]; then
            cp ../kernel_source/out/arch/arm64/boot/Image.gz Image.gz
            find ../kernel_source/out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} dtb \; || true
          fi

          BUILD_DATE=$(date +'%Y%m%d_%H%M')
          ZIP_NAME="Mahiro-HyperOS-KSUNext-v3-Nabu-${BUILD_DATE}.zip"
          zip -r9 "../${ZIP_NAME}" * -x .git README.md *placeholder
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Create GitHub Release
        if: ${{ inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_DATE }}
          name: Mahiro Kernel + KernelSU-Next v3 (${{ inputs.ksu_tag }})
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
