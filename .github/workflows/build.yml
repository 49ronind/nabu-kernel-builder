name: Build Xiaomi Pad 5 (nabu) HyperOS Kernel with KernelSU-Next

on:
  workflow_dispatch:
    inputs:
      ksu_tag:
        description: 'KernelSU-Next legacy tag or branch (default: legacy)'
        required: true
        default: 'legacy'
        type: string
      create_release:
        description: 'Publish as a GitHub Release?'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Compile Nabu HyperOS Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            build-essential bc flex bison libssl-dev libelf-dev \
            libncurses-dev zip curl git lld llvm python3 file \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            device-tree-compiler

      - name: Clone Nabu HyperOS Kernel Source
        run: |
          git clone --depth=1 -b HyperOS1-ksu-next https://github.com/Kuugo2002/xiaomi_kernel_nabu.git kernel_source

      - name: Download Official AOSP Clang Toolchain (r416183b)
        run: |
          mkdir -p clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz

      - name: Integrate KernelSU-Next (${{ inputs.ksu_tag }})
        working-directory: kernel_source
        run: |
          echo "[+] Integrating KernelSU-Next (${{ inputs.ksu_tag }})..."
          
          # Clean up any leftover submodules/symlinks
          rm -rf KernelSU-Next drivers/kernelsu
          
          # Run official KernelSU-Next setup script for specified tag/branch
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s ${{ inputs.ksu_tag }}

          # Configure defconfigs for KernelSU-Next manual hook mode and OverlayFS
          for conf in arch/arm64/configs/nabu_defconfig arch/arm64/configs/nabu-perf_defconfig; do
            if [ -f "$conf" ]; then
              echo "[+] Updating $conf..."
              sed -i '/CONFIG_KSU/d' "$conf" || true
              sed -i '/CONFIG_OVERLAY_FS/d' "$conf" || true
              echo "CONFIG_KSU=y" >> "$conf"
              echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$conf"
              echo "CONFIG_OVERLAY_FS=y" >> "$conf"
            fi
          done

      - name: Pre-Flight Integrity Check
        working-directory: kernel_source
        run: |
          echo "[+] Running Pre-Flight Verification Checks..."
          
          # Verify Toolchain binaries
          export PATH="$(pwd)/../clang/bin:$PATH"
          clang --version | head -n 1
          ld.lld --version | head -n 1
          aarch64-linux-gnu-gcc --version | head -n 1
          arm-linux-gnueabi-gcc --version | head -n 1
          
          # Verify KernelSU-Next manual hook suite in kernel source
          grep -q "ksu_handle_execveat" fs/exec.c || { echo "[-] Missing ksu_handle_execveat in fs/exec.c"; exit 1; }
          grep -q "ksu_handle_faccessat" fs/open.c || { echo "[-] Missing ksu_handle_faccessat in fs/open.c"; exit 1; }
          grep -q "ksu_handle_vfs_read" fs/read_write.c || { echo "[-] Missing ksu_handle_vfs_read in fs/read_write.c"; exit 1; }
          grep -q "ksu_handle_stat" fs/stat.c || { echo "[-] Missing ksu_handle_stat in fs/stat.c"; exit 1; }
          grep -q "ksu_handle_sys_reboot" kernel/reboot.c || { echo "[-] Missing ksu_handle_sys_reboot in kernel/reboot.c"; exit 1; }
          grep -q "path_umount" fs/namespace.c || { echo "[-] Missing path_umount in fs/namespace.c"; exit 1; }
          grep -q "CONFIG_KSU=y" arch/arm64/configs/nabu_defconfig || { echo "[-] Missing CONFIG_KSU in defconfig"; exit 1; }
          grep -q "CONFIG_KSU_MANUAL_HOOK=y" arch/arm64/configs/nabu_defconfig || { echo "[-] Missing CONFIG_KSU_MANUAL_HOOK in defconfig"; exit 1; }
          
          echo "[+] Pre-Flight Checks Passed 100%!"

      - name: Compile Kernel & DTBs
        working-directory: kernel_source
        run: |
          export PATH="$(pwd)/../clang/bin:$PATH"

          # Step 1: Generate maintainer-intended defconfig with full LLVM parameter set
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            nabu_defconfig

          # Print verified active settings from resolved .config
          echo "[+] Active Defconfig Verification from out/.config:"
          grep -E "CONFIG_KSU|CONFIG_OVERLAY_FS" out/.config || true

          # Step 2: Compile kernel image and device tree blobs
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image dtbs

      - name: Package Complete AnyKernel3 Flashable ZIP
        working-directory: kernel_source
        run: |
          echo "[+] Packaging AnyKernel3 flashable archive..."
          test -f out/arch/arm64/boot/Image || { echo "[-] Missing kernel Image!"; exit 1; }
          
          # 1. Copy newly compiled kernel Image to AnyKernel3 directory
          cp out/arch/arm64/boot/Image anykernel/Image
          
          # 2. Concatenate newly compiled SM8150 device tree blobs into matching dtb
          cat out/arch/arm64/boot/dts/qcom/sm8150*.dtb > anykernel/dtb
          echo "[+] Generated matched DTB ($(wc -c < anykernel/dtb) bytes)"
          
          # 3. Copy newly compiled dtbo overlay if generated
          if [ -f out/arch/arm64/boot/dts/qcom/nabu-sm8150-overlay.dtbo ]; then
            cp out/arch/arm64/boot/dts/qcom/nabu-sm8150-overlay.dtbo anykernel/dtbo.img
          fi
          
          # 4. Generate timestamped flashable ZIP package
          BUILD_DATE=$(date +'%Y%m%d_%H%M')
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          
          ZIP_NAME="AnyKernel3-nabu-HyperOS-KSU-Next-${BUILD_DATE}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          
          mkdir -p ../output
          (cd anykernel && zip -r9 "../../output/${ZIP_NAME}" ./* -x .git .gitignore out/ ./*.zip)
          
          # 5. Verify ZIP integrity
          unzip -t "../output/${ZIP_NAME}" || { echo "[-] Generated ZIP is corrupted!"; exit 1; }
          ls -lh "../output/${ZIP_NAME}"
          echo "[+] Flashable package created successfully: ${ZIP_NAME}"

      - name: Upload Flashable AnyKernel3 Package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: output/${{ env.ZIP_NAME }}

      - name: Create GitHub Release
        if: ${{ inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_DATE }}
          name: Xiaomi Pad 5 (nabu) HyperOS Kernel + KernelSU-Next (${{ inputs.ksu_tag }})
          files: output/${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
