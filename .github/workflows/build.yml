name: Build Xiaomi Pad 5 (nabu) HyperOS Kernel with KernelSU-Next v3

on:
  workflow_dispatch:
    inputs:
      ksu_tag:
        description: 'KernelSU-Next legacy tag or branch (default: legacy)'
        required: true
        default: 'legacy'
        type: string
      create_release:
        description: 'Publish as a GitHub Release?'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Compile Nabu HyperOS Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            build-essential bc flex bison libssl-dev libelf-dev \
            libncurses-dev zip curl git lld llvm python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Clone Mahiro Nabu Kernel Source
        run: |
          git clone --depth=1 https://github.com/utziacre/android_kernel_xiaomi_nabu.git kernel_source

      - name: Download Official AOSP Clang Toolchain (r416183b)
        run: |
          mkdir -p clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz

      - name: Integrate KernelSU-Next (${{ inputs.ksu_tag }}) & Apply Source Fixes
        working-directory: kernel_source
        run: |
          echo "[+] Integrating KernelSU-Next (${{ inputs.ksu_tag }})..."
          
          # Clone KernelSU-Next legacy driver
          git clone --depth=1 -b ${{ inputs.ksu_tag }} https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          
          # Link into kernel drivers tree
          ln -sf "$(pwd)/KernelSU-Next/kernel" drivers/kernelsu
          
          # Link into Makefile and Kconfig if not present
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # Patch KernelSU-Next v3 Supercall hook into kernel/reboot.c (Placement B: after local variables, before CAP_SYS_BOOT)
          python3 -c '
          with open("kernel/reboot.c", "r") as f:
              c = f.read()
          target = "int ret = 0;\n"
          hook = "int ret = 0;\n\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\textern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n"
          if "ksu_handle_sys_reboot" not in c and target in c:
              c = c.replace(target, hook, 1)
              with open("kernel/reboot.c", "w") as f:
                  f.write(c)
              print("[+] Successfully inserted ksu_handle_sys_reboot into kernel/reboot.c")
          '

          # Remove obsolete legacy ksu_handle_devpts hooks from fs/devpts/inode.c
          python3 -c '
          with open("fs/devpts/inode.c", "r") as f:
              c = f.read()
          c = c.replace("#ifdef CONFIG_KSU\nextern int ksu_handle_devpts(struct inode*);\n#endif\n", "")
          c = c.replace("#ifdef CONFIG_KSU\n        ksu_handle_devpts(dentry->d_inode);\n        #endif", "")
          c = c.replace("#ifdef CONFIG_KSU\n\tksu_handle_devpts(dentry->d_inode);\n\t#endif", "")
          with open("fs/devpts/inode.c", "w") as f:
              f.write(c)
          print("[+] Successfully removed obsolete ksu_handle_devpts from fs/devpts/inode.c")
          '

          # Configure defconfigs for Manual Hook mode and Device Tree Overlays
          for conf in arch/arm64/configs/nabu_defconfig arch/arm64/configs/nabu-perf_defconfig; do
            if [ -f "$conf" ]; then
              echo "[+] Updating $conf..."
              sed -i '/CONFIG_KSU/d' "$conf" || true
              sed -i '/CONFIG_OVERLAY_FS/d' "$conf" || true
              echo "CONFIG_KSU=y" >> "$conf"
              echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$conf"
              echo "CONFIG_OVERLAY_FS=y" >> "$conf"
            fi
          done

      - name: Pre-Flight Integrity Check
        working-directory: kernel_source
        run: |
          echo "[+] Running Pre-Flight Verification Checks..."
          
          # Verify Toolchain binaries
          export PATH="$(pwd)/../clang/bin:$PATH"
          clang --version | head -n 1
          ld.lld --version | head -n 1
          aarch64-linux-gnu-gcc --version | head -n 1
          arm-linux-gnueabi-gcc --version | head -n 1
          
          # Verify KernelSU manual hooks
          grep -q "ksu_handle_execveat" fs/exec.c || { echo "[-] Missing ksu_handle_execveat"; exit 1; }
          grep -q "ksu_handle_sys_reboot" kernel/reboot.c || { echo "[-] Missing ksu_handle_sys_reboot"; exit 1; }
          ! grep -q "ksu_handle_devpts" fs/devpts/inode.c || { echo "[-] Obsolete ksu_handle_devpts still present"; exit 1; }
          grep -q "CONFIG_KSU_MANUAL_HOOK=y" arch/arm64/configs/nabu_defconfig || { echo "[-] Missing CONFIG_KSU_MANUAL_HOOK"; exit 1; }
          
          echo "[+] Pre-Flight Checks Passed 100%!"

      - name: Compile Kernel & DTBs
        working-directory: kernel_source
        run: |
          export PATH="$(pwd)/../clang/bin:$PATH"

          # Step 1: Generate defconfig with full LLVM parameter set
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            nabu_defconfig

          # Step 2: Compile discrete kernel image and device tree blobs
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz dtbs

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          cd anykernel

          # Configure anykernel.sh to match known-working Nabu release
          cat << 'EOF' > anykernel.sh
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers
          properties() { '
          kernel.string=Mahiro HyperOS Kernel + KernelSU-Next v3 for Xiaomi Pad 5 (nabu)
          device.name1=nabu
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          '; }
          block=boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          . tools/ak3-core.sh;
          set_perm_recursive 0 0 755 644 $ramdisk/*;
          set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;
          dump_boot;
          if [ -d $ramdisk/overlay ]; then
          	rm -rf $ramdisk/overlay;
          fi;
          patch_cmdline androidboot.force_normal_boot=1
          write_boot;

          ## vendor_boot shell variables
          block=/dev/block/bootdevice/by-name/vendor_boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          # reset for vendor_boot patching
          reset_ak;

          # vendor_boot install
          dump_boot;

          write_boot;
          EOF
          sed -i 's/^[ \t]*//' anykernel.sh

          # Verify compiled kernel artifacts and prebuilt dtbo exist
          test -f ../kernel_source/out/arch/arm64/boot/Image.gz || { echo "[-] Missing Image.gz"; exit 1; }
          test -f ../kernel_source/out/arch/arm64/boot/dts/qcom/sm8150.dtb || { echo "[-] Missing sm8150.dtb"; exit 1; }
          test -f ../prebuilts/dtbo.img || { echo "[-] Missing prebuilt dtbo.img"; exit 1; }

          # 1. Copy newly compiled standalone kernel image
          cp ../kernel_source/out/arch/arm64/boot/Image.gz Image.gz

          # 2. Construct newly compiled standalone DTB matching known-working release order
          cat ../kernel_source/out/arch/arm64/boot/dts/qcom/sm8150.dtb \
              ../kernel_source/out/arch/arm64/boot/dts/qcom/sm8150p.dtb \
              ../kernel_source/out/arch/arm64/boot/dts/qcom/sm8150p-v2.dtb \
              ../kernel_source/out/arch/arm64/boot/dts/qcom/sm8150-v2.dtb > dtb

          # 3. Copy known-working prebuilt DTBO image
          cp ../prebuilts/dtbo.img dtbo.img

          echo "[+] Verified Package Artifacts:"
          ls -lh Image.gz dtb dtbo.img

          BUILD_DATE=$(date +'%Y%m%d_%H%M')
          ZIP_NAME="Mahiro-HyperOS-KSUNext-v3-Nabu-${BUILD_DATE}.zip"
          zip -r9 "../${ZIP_NAME}" * -x .git README.md *placeholder
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Create GitHub Release
        if: ${{ inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_DATE }}
          name: Mahiro Kernel + KernelSU-Next v3 (${{ inputs.ksu_tag }})
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
